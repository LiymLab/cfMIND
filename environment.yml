# ======================
# Usage:
# Create a new environment:
#   conda env create -f environment.yml

#
# Activate the environment:
#   conda activate cfMIND

name: cfMIND
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python environment
  - python=3.7.12
  - pip
  - setuptools
  - wheel
  - pysam=0.16.0
  - numpy<1.24.3
  - pandas<2.0
  - bedtools=2.31.1
  #GCC
  - gcc_impl_linux-64=11.2.0
  - gxx_impl_linux-64=11.2.0
  - gfortran_impl_linux-64=11.2.0
  - libgcc-devel_linux-64=11.2.0
  - libstdcxx-devel_linux-64=11.2.0
  # Command-line tools
  - samtools=1.6      
  - htslib=1.3.1
  - sed=4.8
  - coreutils
  - gawk

  # Bismark
  - bismark=0.24.2
  - bowtie2=2.3.5.1

  # R environment
  - r-base=4.3.2
  - r-readr=2.1.5
  - r-matrix=1.6_1.1
  - r-survival=3.8.3
  - r-nnet=7.3.20
  - r-lattice=0.21-9 #
  - tzdata
  - r-tzdb=0.5.0
  - r-clock=0.7.3
  - r-mgcv=1.9.3
  - r-ggplot2=3.4.4
