# ======================
# Usage:
# Create a new environment:
#   conda env create -f environment.yml

# Activate the environment:
#   conda activate cfMIND
# ======================

name: cfMIND
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python environment
  - python=3.7.12
  - pip=23.3.2
  - setuptools=69.0.3
  - wheel=0.42.0
  - pysam=0.16.0
  - numpy
  - pandas

  # Command-line tools
  - samtools=1.6      
  - htslib=1.3.1
  - sed=4.8
  - coreutils
  - gawk

  # Bismark
  - bismark=0.24.2
  - bowtie2=2.3.5.1

  # R environment
  - r-base=4.3.2
  - r-readr=2.1.5
  - r-matrix=1.6.5
  - r-survival=3.8.3
  - r-nnet=7.3.20
  - r-lattice=0.22-5
  - tzdata
  - r-tzdb=0.5.0
  - r-clock=0.7.3
  - r-mgcv=1.9.3
  - r-ggplot2=3.5.1

  # GCC 13 toolchain for compiling R packages
  - gcc_linux-64=13.*
  - gxx_linux-64=13.*
  - libstdcxx-ng=13.*
  - libgcc-ng=13.*
